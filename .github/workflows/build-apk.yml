name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # для создания Release на тег
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Кэш Android-паков .NET
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-android-${{ runner.os }}-v1

      - name: Установить Android workload
        run: dotnet workload install android

      - name: Сборка Release APK
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: dotnet build -c Release -v q -nologo

      - name: Artifact — APK (на каждый пуш)
        uses: actions/upload-artifact@v4
        with:
          name: TopJournal-apk
          path: bin/Release/net9.0-android/ru.family.topjournal-Signed.apk
          if-no-files-found: error

      # Release с APK + changelog-секцией из CHANGELOG.md — только на тег vX.Y
      - name: Извлечь changelog для версии
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          python3 - "$VER" << 'EOF' > release_notes.md
          import sys, re
          ver = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(rf'##\s*{re.escape(ver)}\b.*?\n(.*?)(?=\n##\s|\Z)', text, re.S)
          print((m.group(1) if m else f'Версия {ver}').strip())
          EOF
          cat release_notes.md

      - name: Release — APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net9.0-android/ru.family.topjournal-Signed.apk
          body_path: release_notes.md
